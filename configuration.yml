storage:
  # Database connection URL.
  # Required environment variables are as follows:
  # - POSTGRES_USER: The username (defaults to 'postgres')
  # - POSTGRES_PASSWORD: The password (defaults to 'binrankbench')
  # - POSTGRES_HOST: The host running your postgresql instance (defaults to 'localhost')
  # - POSTGRES_PORT: The connection port (defaults to 5432)
  # - POSTGRES_DB: The database name (defaults to binrankbench)
  # All these variables can be overriddend through the .env file. 
  # This is recommended as opposed to updating the default values here.
  db_url: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-binrankbench}@${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-binrankbench}"
